<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Повар</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Кухонный помощник: 89 рецептов с граммовкой, силой огня и временем, подбор блюд по продуктам и таймеры.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Раскладка: на компьютере — боковое меню и рабочая область; на телефоне — нижняя панель вкладок.
   Тон — «чугун и шалфей»: холодноватый светлый фон, зелёный акцент для действий, огненная шкала только для силы огня. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E9EDE6; --ink:#1B211D; --muted:#5C6860; --line:#D8DED5;
  --accent:#2E6A4E; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2;
  --ok:#2E8B57; --warn:#B86A12; --warn-soft:#FBEBD6; --danger:#B3261E;
  --f1:#F2C14E; --f2:#F29A3A; --f3:#E8622C; --f4:#C9302C; --oven:#7A4FB5; --off:#C8CFC6;
  --display:"Unbounded", "Golos Text", system-ui, sans-serif;
  --body:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A201C; --sunk:#232A25; --ink:#E6ECE6; --muted:#98A49B; --line:#2D3530;
  --accent:#7CC59D; --accent-ink:#0F1A13; --accent-soft:#1F3328; --ok:#6FCB94; --warn:#F0A14A; --warn-soft:#3A2A16; --danger:#F28B82;
  --off:#3A433D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A201C; --sunk:#232A25; --ink:#E6ECE6; --muted:#98A49B; --line:#2D3530;
  --accent:#7CC59D; --accent-ink:#0F1A13; --accent-soft:#1F3328; --ok:#6FCB94; --warn:#F0A14A; --warn-soft:#3A2A16; --danger:#F28B82;
  --off:#3A433D; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:where(svg[aria-hidden]){width:1.15em;height:1.15em;flex:none}
.back svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(22px,3.2vw,30px)} h2{font-size:18px} h3{font-size:15px;font-family:var(--body);font-weight:700}
.muted{color:var(--muted)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---- каркас ---- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;font-weight:700;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:18px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav svg{width:20px;height:20px;flex:none}
.nav .badge{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:20px;font-size:11px;padding:1px 7px;font-family:var(--mono)}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
main{min-width:0;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wrap .wrap{width:100%}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:20;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line)}
  .brand,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav a{flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;flex:1;text-align:center;position:relative}
  .nav .badge{position:absolute;top:0;right:calc(50% - 22px);margin:0}
  main{padding-block:16px calc(var(--nav-h) + 80px + env(safe-area-inset-bottom,0px))}
}

/* ---- элементы ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);transition:background .15s}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;min-width:0}
.field input{border:0;background:transparent;padding:11px 0;outline:none;width:100%;min-width:0}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .field{flex:1 1 260px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;user-select:none}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{margin:4px 0 0}

/* ---- карточки рецептов ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.dish{flex:none;width:52px;height:52px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;font-size:28px}
.card-body{min-width:0;display:flex;flex-direction:column;gap:4px}
.card-title{font-weight:700;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:14px;height:14px}
.have{font-size:12px;font-weight:600}
.have.ok{color:var(--ok)} .have.part{color:var(--warn)}
.bar{height:5px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--warn);border-radius:5px}
.bar.ok i{background:var(--ok)}
.section-title{display:flex;align-items:baseline;gap:10px}
.section-title .num{color:var(--muted);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* ---- рецепт ---- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:500;font-size:14px}
.back:hover{color:var(--ink)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .dish{width:84px;height:84px;font-size:46px;border-radius:20px}
.hero-text{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:500}
.fact svg{width:15px;height:15px;color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
.detail .col{display:flex;flex-direction:column;gap:16px;min-width:0}
.sticky{position:sticky;top:20px}
@media (max-width:980px){ .detail{grid-template-columns:minmax(0,1fr)} .sticky{position:static} }
.servings{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{width:44px;height:44px;border:0;background:transparent;font-size:22px;line-height:1}
.stepper button:hover{background:var(--sunk)}
.stepper output{min-width:56px;text-align:center;font-family:var(--mono);font-size:20px;font-weight:700}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:grid;grid-template-columns:28px minmax(0,1fr) auto 20px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ing li:last-child{border-bottom:0}
.ing .nm{min-width:0}
.ing .nm small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.ing .opt{font-size:11px;color:var(--muted);margin-left:6px}
.ing .amt{text-align:right;font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap}
.ing .amt small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--off)}
.dot.on{border-color:var(--ok);background:var(--ok);box-shadow:inset 0 0 0 3px var(--surface)}
.ware{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.ware li{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:8px;padding:5px 10px;font-size:13.5px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:36px minmax(0,1fr);gap:4px 14px}
.step-n{grid-row:span 3;width:36px;height:36px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-weight:700}
.step p{margin:0;font-size:15.5px}
.step-meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:8px}
.par{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:6px;width:fit-content}
.tips{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* ---- шкала огня: 9 делений, как на конфорке ---- */
.heat{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.dial{display:inline-flex;gap:2px;align-items:flex-end;height:18px}
.dial i{width:5px;border-radius:2px;background:var(--off)}
.dial i:nth-child(1){height:6px}.dial i:nth-child(2){height:7px}.dial i:nth-child(3){height:8px}.dial i:nth-child(4){height:10px}.dial i:nth-child(5){height:11px}.dial i:nth-child(6){height:13px}.dial i:nth-child(7){height:14px}.dial i:nth-child(8){height:16px}.dial i:nth-child(9){height:18px}
.dial i.l1{background:var(--f1)} .dial i.l2{background:var(--f2)} .dial i.l3{background:var(--f3)} .dial i.l4{background:var(--f4)}
.heat .hint{font-weight:500;color:var(--muted)}
.oven{display:inline-flex;align-items:center;gap:6px;color:var(--oven);font-weight:700;font-size:13px}
.oven svg{width:18px;height:18px}
.time{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.time svg{width:15px;height:15px}
.tbtn{margin-left:auto}
.running{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--accent);font-size:15px}

/* ---- продукты ---- */
.scan{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scan-btn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px;border-radius:var(--r);background:var(--ink);color:var(--bg);border:0;text-align:left;overflow:hidden}
.scan-btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.scan-btn strong{font-size:16px}
.scan-btn span{font-size:13px;opacity:.75}
.scan-btn svg{width:26px;height:26px}
.scan-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (max-width:520px){ .scan{grid-template-columns:minmax(0,1fr)} }
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:14px;font-weight:500;min-width:0}
.pitem span.t{min-width:0;overflow-wrap:anywhere}
.pitem[aria-pressed="true"]{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.pitem .dot{margin-left:auto;flex:none}
.basics{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px}
.scanbox{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:start}
.scanbox img{width:100%;border-radius:12px;max-height:260px;object-fit:cover}
@media (max-width:640px){ .scanbox{grid-template-columns:minmax(0,1fr)} }
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--danger);font-weight:500}

/* ---- идеи ---- */
.advice{background:var(--accent-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.advice h2{color:var(--accent)}
.advice p{margin:0}
.ai-out{white-space:pre-wrap;margin:0;font-size:14.5px}
.miss{font-size:12.5px;color:var(--warn);font-weight:500}
.sub{font-size:12px;color:var(--muted)}

/* ---- таймеры ---- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.timer{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.timer.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.ring{flex:none;width:56px;height:56px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--sunk)} .ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer.done .ring .fg{stroke:var(--ok)}
.timer .tt{min-width:0;flex:1}
.timer .tt div:first-child{font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.timer .big{font-family:var(--mono);font-size:24px;font-weight:700}
.timer .acts{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--mono)}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:18px;height:18px}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.presets button{padding:12px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:var(--mono);font-weight:700}
.presets button:hover{border-color:var(--accent)}
.custom{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.custom .field{flex:1 1 220px}
.custom .mm{display:flex;align-items:center;gap:6px}
.custom .mm input{width:64px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-family:var(--mono)}
.cheat{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 24px}
.cheat li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.cheat li span:first-child{flex:1}

/* плавающая полоса таймеров */
.dock{position:fixed;z-index:15;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px;align-items:flex-end;max-width:calc(100% - 32px)}
.dock a{display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 14px;text-decoration:none;font-size:13px;max-width:100%;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.dock a.done{background:var(--ok);color:#fff;animation:pulse 1s ease-in-out infinite alternate}
.dock a span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dock a b{font-family:var(--mono)}
@keyframes pulse{to{transform:scale(1.04)}}
@media (max-width:860px){ .dock{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px))} }

/* ---- режим готовки ---- */
.cook{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cook-top{display:flex;align-items:center;gap:12px}
.cook-top h2{flex:1;min-width:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{height:4px;background:var(--sunk);border-radius:4px;margin:12px 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.cook-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:8px 0}
.cook-body .k{font-family:var(--mono);color:var(--accent);font-weight:700}
.cook-body .txt{font-size:clamp(20px,3.4vw,30px);line-height:1.35;max-width:30ch;font-weight:500;text-wrap:balance}
.cook-body .heat{font-size:15px}
.cook-body .dial{height:26px}.cook-body .dial i{width:8px}
.cook-clock{font-family:var(--mono);font-size:clamp(48px,10vw,84px);font-weight:700;line-height:1}
.cook-prep{width:100%;max-width:620px;text-align:left}
.cook-nav{display:flex;gap:10px;justify-content:space-between}
.cook-nav .btn{padding:14px 18px;font-size:15px}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }

/* ===== Дополнения: поиск, избранное, покупки, подсказки ===== */
.block{display:flex;flex-direction:column;gap:12px;width:100%;min-width:0}
.results{display:flex;flex-direction:column;gap:28px;min-width:0}
.toolbar .field.grow{flex:1 1 280px}
.wrap>.field{flex:none}
.field kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.field .clear{border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:4px;border-radius:50%}
.field .clear:hover{background:var(--sunk);color:var(--ink)}
.select{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.select select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:14px;color:var(--ink)}
.chip small{font-family:var(--mono);font-size:11px;opacity:.65;margin-left:2px}
.chip.ghost{background:transparent;border-style:dashed}
.chip.ghost[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.hintbar{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);background:var(--warn-soft);border-radius:10px;padding:8px 12px}
.hintbar svg{color:var(--warn);flex:none}
.hintbar b{color:var(--ink)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.empty p{margin:0 0 8px}
.card{position:relative}
.card-top{display:flex;align-items:flex-start;gap:6px}
.card-top .card-title{flex:1;min-width:0}
.fav{border:0;background:transparent;color:var(--muted);padding:2px;margin:-4px -4px 0 0;border-radius:50%;display:grid;place-items:center;flex:none}
.fav svg{width:20px;height:20px}
.fav:hover{color:var(--warn);background:var(--sunk)}
.fav.on{color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag svg{width:11px;height:11px}
.tag.t-veg{background:var(--accent-soft);color:var(--accent)}
.tag.t-quick{background:var(--warn-soft);color:var(--warn)}
.facts .tag{font-size:12px;padding:4px 10px;border-radius:999px}
.hero-acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.on{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.ing .subs{color:var(--warn)}
.ing button.dot{padding:0;cursor:pointer;background:transparent}
.ing button.dot.on{background:var(--ok)}
.ing button.dot:disabled{cursor:default;opacity:.6}
.step-n{border:0;cursor:pointer;color:var(--ink)}
.step-n:hover{background:var(--accent-soft);color:var(--accent)}
.step-n svg{width:18px;height:18px}
.step.done{opacity:.55}
.step.done .step-n{background:var(--ok);color:#fff}
.step.done p{text-decoration:line-through;text-decoration-color:var(--muted)}
.tips-panel{background:var(--warn-soft);border-color:transparent}
.minelist{display:flex;flex-wrap:wrap;gap:6px}
.minechip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px 5px 8px;font-size:13.5px}
.minechip span{color:var(--muted);margin-left:2px}
.minechip:hover{border-color:var(--danger);color:var(--danger)}
.shop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.shop h2{display:inline-flex;align-items:center;gap:8px}
.shop h2 svg{width:20px;height:20px}
.shoplist,.unlock{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.unlock .pitem .t small{display:block;color:var(--accent);font-weight:600;font-size:12px}
.unlock .pitem svg{width:18px;height:18px;margin-left:auto;flex:none;color:var(--accent)}
.unlock .pitem:disabled{opacity:.55;cursor:default}
.pitem[data-act="bought"]:hover .dot{border-color:var(--ok);background:var(--ok)}
.badge.alt{background:var(--warn)}
details.panel summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details.panel summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.panel[open] summary::before{transform:rotate(45deg)}
.nextstep{max-width:40ch;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;margin-top:6px;text-align:center}
.nextstep .label{display:block;margin-bottom:4px}
.toast{position:fixed;left:50%;width:max-content;max-width:calc(100vw - 32px);bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast span{min-width:0}
.toast a{color:var(--f1);font-weight:700;text-decoration:none;white-space:nowrap}
@media (max-width:860px){ .toast{bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px))} .select{width:100%;justify-content:space-between} .select select{flex:1} }

function dist(a, b, max) {

async function shrinkToBase64(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = url; });
    const k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", 0.8).split(",")[1];
  } finally { URL.revokeObjectURL(url); }
}
async function askClaude(prompt, {image, onText} = {}) {

    if (image) opts.images = [image];

  const key = STANDALONE ? store.get("apikey", "") : "";
  if (!key) throw {code: "no_ai"};

  if (image) content.push({type: "image", source: {type: "base64", media_type: "image/jpeg", data: await shrinkToBase64(image)}});

    method: "POST",
    headers: {"content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true"},
    body: JSON.stringify({model: "claude-opus-5-5", max_tokens: 1500, messages: [{role: "user", content}]})

  const text = (json.content || []).map(b => b.text || "").join("");
  if (onText) onText(text);
  return text;
}

  all.filter(m => m.miss.length && m.miss.length <= 2).forEach(m => m.miss.forEach(id => cnt[id] = (cnt[id] || 0) + (m.miss.length === 1 ? 2 : 1)));
  return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id]) => ({id, n: all.filter(m => m.miss.length <= 2 && m.miss.includes(id)).length}));
}
function adviceLines(all) {
  const lines = [];
  const ready = all.filter(m => !m.miss.length);
  if (ready.length) {
    const fast = ready.reduce((a, b) => a.r.total <= b.r.total ? a : b);
    lines.push(`У вас есть всё для ${ready.length} ${plural(ready.length, "блюда", "блюд", "блюд")}. Быстрее всего — «${fast.r.n}», ${fmtMin(fast.r.total)}.`);
  } else {
    const best = all.find(m => m.miss.length === 1) || all.find(m => m.have > 0);
    if (best) lines.push(`Докупите ${best.miss.map(lower).join(", ")} — и можно готовить «${best.r.n}».`);
    else lines.push("Продуктов пока мало. Чаще всего в рецептах нужны яйца, лук, картофель, морковь и макароны.");
  }
  const fresh = [...S.pantry].filter(id => PERISHABLE.has(id));
  if (fresh.length) {
    const use = all.find(m => m.miss.length <= 1 && m.r.key.some(id => fresh.includes(id)));
    const names = fresh.slice(0, 5).map(lower).join(", ");
    lines.push(use ? `Сначала используйте скоропортящееся (${names}) — например, в «${use.r.n}».` : `Сначала используйте скоропортящееся: ${names}.`);

/* ===== Таймеры ===== */
const tLeft = t => t.done ? 0 : t.end ? (t.end - Date.now()) / 1000 : t.left;
const findTimer = title => S.timers.find(t => t.title === title);
function startTimer(title, sec) {
  if (!(sec > 0)) return;
  S.timers.unshift({id: Math.random().toString(36).slice(2, 9), title, dur: sec, end: Date.now() + sec * 1000, left: sec, done: false});
  saveTimers(); unlockAudio(); render();
  toast(`Таймер «${title}» запущен`, {href: "#timers", label: "Таймеры"});
}
function timerAct(act, id) {
  const t = S.timers.find(x => x.id === id); if (!t) return;
  if (act === "pause" && t.end) { t.left = tLeft(t); t.end = null; }
  if (act === "resume" && !t.end && !t.done) t.end = Date.now() + t.left * 1000;
  if (act === "plus") {
    if (t.done) { t.done = false; t.dur = 60; t.end = Date.now() + 60000; }
    else if (t.end) { t.end += 60000; t.dur += 60; }
    else { t.left += 60; t.dur += 60; }
  }
  if (act === "restart") { t.done = false; t.end = Date.now() + t.dur * 1000; t.left = t.dur; }
  if (act === "del") S.timers = S.timers.filter(x => x !== t);
  saveTimers(); render();
}
let audio = null;
function unlockAudio() { try { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); if (audio.state === "suspended") audio.resume(); } catch {} }
function alarm() {
  try {
    if (audio) {
      const now = audio.currentTime;
      for (let i = 0; i < 4; i++) {
        const o = audio.createOscillator(), g = audio.createGain();
        o.frequency.value = i % 2 ? 660 : 880; o.type = "sine";
        g.gain.setValueAtTime(0.0001, now + i * 0.35); g.gain.exponentialRampToValueAtTime(0.35, now + i * 0.35 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.35 + 0.28);
        o.connect(g).connect(audio.destination); o.start(now + i * 0.35); o.stop(now + i * 0.35 + 0.3);
      }
    }
  } catch {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300, 150, 300]); } catch {}
}
const RING = 150.8;
function tick() {
  let fired = false;
  for (const t of S.timers) if (t.end && !t.done && t.end <= Date.now()) { t.done = true; t.end = null; t.left = 0; fired = true; }
  if (fired) { saveTimers(); alarm(); render(); return; }
  document.querySelectorAll("[data-tclock]").forEach(el => { const t = S.timers.find(x => x.id === el.dataset.tclock); if (t) el.textContent = fmtClock(tLeft(t)); });
  document.querySelectorAll("[data-tring]").forEach(el => { const t = S.timers.find(x => x.id === el.dataset.tring); if (t) el.style.strokeDashoffset = RING * (tLeft(t) / t.dur); });
  const doneN = S.timers.filter(t => t.done).length;
  document.title = doneN ? "⏰ Готово! · Повар" : "Повар";
}
setInterval(tick, 250);

function heatHTML(h, temp) {
  if (h === 5) return `<span class="oven">${ICON.thermo}Духовка ${temp || 180} °C</span>`;
  if (!h) return `<span class="time">Без огня</span>`;
  const [name, lo, hi] = HEAT[h];
  let bars = ""; for (let i = 1; i <= 9; i++) bars += `<i class="${i <= hi ? "l" + h : ""}"></i>`;
  return `<span class="heat"><span class="dial" aria-hidden="true">${bars}</span>${name}<span class="hint">${lo}–${hi} из 9</span></span>`;
}
function amount(x, f) {
  if (x.tt) return {a: "по вкусу", g: ""};
  const v = x.amount * f; let a, g = "";
  if (x.unit === "pc" || x.unit === "tbsp" || x.unit === "tsp") {
    a = fmtNum(Math.max(0.5, Math.round(v * 2) / 2)) + " " + UNITS[x.unit];
    const gpp = x.unit === "pc" ? ING[x.id][3] : x.unit === "tbsp" ? 15 : 5;
    if (gpp) g = "≈ " + Math.round(v * gpp) + " г";
  } else if (x.unit === "pinch") a = fmtNum(Math.max(1, Math.round(v))) + " щеп.";
  else {
    const r = v >= 100 ? Math.round(v / 5) * 5 : Math.max(1, Math.round(v));
    a = r >= 1000 ? fmtNum(Math.round(r / 100) / 10) + (x.unit === "g" ? " кг" : " л") : r + " " + UNITS[x.unit];
  }
  return {a, g};
}
const tagsHTML = r => r.tags.filter(t => t !== "few").map(t => `<span class="tag t-${t}">${TAGS[t][1]}${TAGS[t][0]}</span>`).join("");
function cardHTML(r, extra = "") {

  const status = S.pantry.size && !extra ? `<div class="have ${miss.length ? "part" : "ok"}">${miss.length ? `Есть ${haveN} из ${r.key.length} продуктов` : "Все продукты есть"}</div>` : "";

    <div class="card-top"><div class="card-title">${esc(r.n)}</div><button class="fav ${S.favs.has(r.id) ? "on" : ""}" data-act="fav" data-id="${r.id}" aria-label="${S.favs.has(r.id) ? "Убрать из избранного" : "В избранное"}" aria-pressed="${S.favs.has(r.id)}">${S.favs.has(r.id) ? ICON.starFill : ICON.star}</button></div>
    <div class="meta"><span>${ICON.clock}${fmtMin(r.total)}</span><span>${ICON.user}${r.s} ${plural(r.s, "порция", "порции", "порций")}</span><span>${DIFF[r.d]}</span></div>
    <div class="tags">${tagsHTML(r)}</div>
    ${extra || status}</div></a>`;
}
function filtered() {
  const q = S.q.trim();
  let hint = "", layoutFixed = false, list;
  if (q) { const res = runSearch(RECIPE_INDEX, q); list = res.results.map(x => x.item); hint = res.hint; layoutFixed = res.layoutFixed; }
  else list = RECIPES;
  list = list.filter(r => (S.cat === "all" || (S.cat === "fav" ? S.favs.has(r.id) : r.c === S.cat)) && (!S.tag || r.tags.includes(S.tag) || (S.tag === "mine" && !missing(r).length)));
  if (!q || S.sort !== "cat") {

    if (S.sort === "match") list = [...list].sort((a, b) => missing(a).length - missing(b).length || a.total - b.total);
  }
  return {list, hint, layoutFixed, q};
}
function sectionHTML(title, items, mapper = r => cardHTML(r)) {

    <div class="tt"><div>${esc(t.title)}</div><div class="big" ${t.done ? "" : `data-tclock="${t.id}"`}>${t.done ? "Готово!" : fmtClock(left)}</div></div>

/* ===== Режим готовки ===== */
let wakeLock = null;
function cookHTML() {
  const c = S.cook; if (!c) return "";
  const r = BY_ID[c.id], n = r.steps.length, f = c.sv / r.s;
  let body;
  if (c.page === 0) {
    body = `<div class="cook-prep block"><h2>Подготовьте на ${c.sv} ${plural(c.sv, "персону", "персоны", "персон")}</h2>
      <ul class="ing">${r.ings.map(x => { const {a, g} = amount(x, f); return `<li><span>${ING[x.id][1]}</span><span class="nm">${esc(ING[x.id][0])}${x.optional ? `<span class="opt">по желанию</span>` : ""}${x.note ? `<small>${esc(x.note)}</small>` : ""}</span><span class="amt">${a}${g ? `<small>${g}</small>` : ""}</span><span class="dot ${has(x.id) ? "on" : ""}"></span></li>`; }).join("")}</ul>
      <h3 style="margin-top:6px">Посуда</h3><ul class="ware">${r.ware.map(w => `<li>${WARE[w][1]} ${WARE[w][0]}</li>`).join("")}</ul></div>`;
  } else {
    const s = r.steps[c.page - 1], title = `${r.n} · шаг ${c.page}`, t = findTimer(title), nx = r.steps[c.page];
    let clock = "";
    if (s.m) clock = t ? `<div class="cook-clock" ${t.done ? "" : `data-tclock="${t.id}"`}>${t.done ? "Готово!" : fmtClock(tLeft(t))}</div>
        <div class="toolbar" style="justify-content:center">${t.done ? `<button class="btn" data-act="t-restart" data-id="${t.id}">Ещё раз</button>` : `<button class="btn" data-act="${t.end ? "t-pause" : "t-resume"}" data-id="${t.id}">${t.end ? "Пауза" : "Продолжить"}</button>`}<button class="btn" data-act="t-plus" data-id="${t.id}">+1 мин</button></div>`
      : `<div class="cook-clock">${fmtClock(s.m * 60)}</div><button class="btn primary" data-act="tstart" data-title="${esc(title)}" data-min="${s.m}">${ICON.timer}Запустить таймер</button>`;
    body = `<div class="k">Шаг ${c.page} из ${n}${s.par ? " · параллельно" : ""}</div><div class="txt">${esc(s.text)}</div>${heatHTML(s.h, s.temp)}${clock}
      ${nx ? `<div class="nextstep"><span class="label">Дальше</span>${esc(nx.text)}</div>` : `<div class="nextstep"><span class="label">Дальше</span>Готово — приятного аппетита!</div>`}`;
  }
  return `<div class="cook" role="dialog" aria-modal="true" aria-label="Режим готовки">
    <div class="cook-top"><h2>${r.e} ${esc(r.n)}</h2><button class="btn ghost" data-act="cook-close">${ICON.x}Закрыть</button></div>
    <div class="progress"><i style="width:${100 * c.page / n}%"></i></div>
    <div class="cook-body">${body}</div>
    <div class="cook-nav"><button class="btn" data-act="cook-prev" ${c.page === 0 ? "disabled" : ""}>${ICON.back}Назад</button>
      ${c.page < n ? `<button class="btn primary" data-act="cook-next">${c.page === 0 ? "Начать" : "Далее"}${ICON.next}</button>` : `<button class="btn primary" data-act="cook-close">Готово, приятного аппетита</button>`}</div></div>`;
}
async function openCook(id) {
  S.cook = {id, page: 0, sv: S.servings[id] || BY_ID[id].s};
  unlockAudio();
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  render();
}
function closeCook() { S.cook = null; try { wakeLock?.release(); } catch {} wakeLock = null; render(); }
document.addEventListener("visibilitychange", async () => { if (S.cook && document.visibilityState === "visible") { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} } });

/* ===== Каркас и маршруты ===== */
const NAV = [["menu", "Меню", ICON.book], ["pantry", "Продукты", ICON.fridge], ["ideas", "Что приготовить", ICON.bulb], ["timers", "Таймеры", ICON.timer]];
document.getElementById("root").innerHTML = `<div class="app"><aside class="side"><div class="brand"><span class="brand-mark" aria-hidden="true">🍳</span>Повар</div>
  <nav class="nav" id="nav" aria-label="Разделы"></nav><div class="side-foot">${RECIPES.length} рецептов · ${Object.keys(ING).length} продуктов.<br>Продукты, избранное и таймеры сохраняются в этом браузере.</div></aside>
  <main id="main"><div class="wrap" id="view"></div></main></div><div class="dock" id="dock"></div><div id="cook"></div><div id="toast" class="toast" hidden></div>`;

function route() {
  const h = location.hash.slice(1);
  if (h.startsWith("r-") && BY_ID[h.slice(2)]) return {v: "recipe", id: h.slice(2)};
  return {v: ["pantry", "ideas", "timers"].includes(h) ? h : "menu"};
}
let lastKey = "";
function render() {
  const rt = route(), key = rt.v + (rt.id || "");
  const active = S.timers.filter(t => !t.done).length;
  document.getElementById("nav").innerHTML = NAV.map(([k, n, ic]) => `<a href="#${k}" ${(rt.v === k || (rt.v === "recipe" && k === "menu")) ? 'aria-current="page"' : ""}>${ic}<span>${n}</span>${k === "timers" && active ? `<span class="badge">${active}</span>` : (k === "pantry" && S.shop.size ? `<span class="badge alt">${S.shop.size}</span>` : "")}</a>`).join("");
  const focus = document.activeElement?.id, caret = document.activeElement?.selectionStart;
  const view = document.getElementById("view");
  if (rt.v === "recipe" && key !== lastKey) { S.recent = [rt.id, ...S.recent.filter(x => x !== rt.id)].slice(0, 8); save(); }
  view.innerHTML = rt.v === "recipe" ? recipeView(BY_ID[rt.id]) : rt.v === "pantry" ? pantryView() : rt.v === "ideas" ? ideasView() : rt.v === "timers" ? timersView() : menuView();
  if (focus && key === lastKey) { const el = document.getElementById(focus); if (el) { el.focus({preventScroll: true}); try { el.setSelectionRange(caret, caret); } catch {} } }
  if (key !== lastKey) window.scrollTo(0, 0);
  lastKey = key;
  const dock = document.getElementById("dock");
  dock.hidden = rt.v === "timers" || !S.timers.length || !!S.cook;
  dock.innerHTML = S.timers.slice(0, 3).map(t => `<a href="#timers" class="${t.done ? "done" : ""}">${ICON.timer}<span class="n">${esc(t.title)}</span><b ${t.done ? "" : `data-tclock="${t.id}"`}>${t.done ? "готово" : fmtClock(tLeft(t))}</b></a>`).join("")
    + (S.timers.length > 3 ? `<a href="#timers">Ещё ${S.timers.length - 3}</a>` : "");
  document.getElementById("cook").innerHTML = cookHTML();
}
const refreshResults = () => { const el = document.getElementById("results"); if (el) el.innerHTML = resultsHTML(); };

/* ===== События ===== */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const {act, v, id} = b.dataset;
  if (b.closest("a.card")) e.preventDefault();
  if (act === "cat") { S.cat = v; render(); }
  else if (act === "tag") { S.tag = v; render(); }
  else if (act === "setq") { S.q = v || ""; render(); if (v) document.getElementById("q")?.focus(); }
  else if (act === "setpq") { S.pq = ""; render(); document.getElementById("pq")?.focus(); }
  else if (act === "clearf") { S.cat = "all"; S.tag = ""; render(); }
  else if (act === "fav") { S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); save(); render(); toast(S.favs.has(id) ? `«${BY_ID[id].n}» — в избранном` : `Убрано из избранного`); }
  else if (act === "srv") { const r = BY_ID[id]; S.servings[id] = Math.min(30, Math.max(1, (S.servings[id] || r.s) + +v)); save(); render(); }
  else if (act === "stepdone") { const st = S.done[id]; st.has(+v) ? st.delete(+v) : st.add(+v); render(); }
  else if (act === "stepreset") { S.done[id] = new Set(); render(); }
  else if (act === "copylink") {
    const url = location.href.split("#")[0] + "#r-" + id;
    navigator.clipboard?.writeText(url).then(() => toast("Ссылка на рецепт скопирована"), () => toast(url));
  }
  else if (act === "shopadd") { const ids = v.split(",").filter(x => ING[x] && !has(x)); ids.forEach(x => S.shop.add(x)); save(); render(); if (ids.length) toast(`В список покупок: ${ids.slice(0, 3).map(lower).join(", ")}${ids.length > 3 ? ` и ещё ${ids.length - 3}` : ""}`, {href: "#pantry", label: "Открыть"}); }
  else if (act === "shopclear") { S.shop.clear(); save(); render(); }
  else if (act === "bought") { S.shop.delete(v); S.pantry.add(v); save(); render(); toast(`${ING[v][0]} — теперь в «У меня есть»`); }
  else if (act === "tstart") startTimer(b.dataset.title, +b.dataset.min * 60);
  else if (act === "preset") startTimer(`Таймер ${b.dataset.min} мин`, +b.dataset.min * 60);
  else if (act === "custom") {
    const m = Math.max(0, +document.getElementById("cmin").value || 0), s = Math.min(59, Math.max(0, +document.getElementById("csec").value || 0));
    startTimer(document.getElementById("ctitle").value.trim() || "Таймер", m * 60 + s);
  }
  else if (act.startsWith("t-")) timerAct(act.slice(2), id);
  else if (act === "ptoggle") { if (S.pantry.has(v)) S.pantry.delete(v); else { S.pantry.add(v); S.shop.delete(v); } save(); render(); }
  else if (act === "pclear") { S.pantry.clear(); save(); render(); }
  else if (act === "scansel") { S.scan.sel.has(v) ? S.scan.sel.delete(v) : S.scan.sel.add(v); render(); }
  else if (act === "scanadd") { S.scan.sel.forEach(x => { S.pantry.add(x); S.shop.delete(x); }); save(); URL.revokeObjectURL(S.scan.url); const n = S.scan.sel.size; S.scan = null; render(); toast(`Добавлено ${n} ${plural(n, "продукт", "продукта", "продуктов")}`, {href: "#ideas", label: "Что приготовить"}); }
  else if (act === "scanclose") { URL.revokeObjectURL(S.scan.url); S.scan = null; render(); }
  else if (act === "savekey") { store.set("apikey", document.getElementById("apikey").value.trim()); AI.ready = AI.images = !!store.get("apikey", ""); render(); toast(AI.ready ? "Ключ сохранён" : "Ключ удалён"); }
  else if (act === "ai") askChef();
  else if (act === "cook-open") openCook(id);
  else if (act === "cook-close") closeCook();
  else if (act === "cook-next") { S.cook.page = Math.min(BY_ID[S.cook.id].steps.length, S.cook.page + 1); render(); }
  else if (act === "cook-prev") { S.cook.page = Math.max(0, S.cook.page - 1); render(); }
});
document.addEventListener("input", e => {
  const s = e.target.dataset?.search;
  if (s === "menu") { S.q = e.target.value; refreshResults(); }
  if (s === "pantry") { S.pq = e.target.value; document.getElementById("pgrid").innerHTML = pantryGridHTML(); }
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-sort]")) { S.sort = e.target.value; refreshResults(); }
  if (e.target.matches("[data-scan]")) { handleScan(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("keydown", e => {
  if (S.cook) {
    if (e.key === "Escape") closeCook();
    if (e.key === "ArrowRight") { S.cook.page = Math.min(BY_ID[S.cook.id].steps.length, S.cook.page + 1); render(); }
    if (e.key === "ArrowLeft") { S.cook.page = Math.max(0, S.cook.page - 1); render(); }
    return;
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); const el = document.getElementById("q") || document.getElementById("pq"); if (el) el.focus(); else { location.hash = "menu"; setTimeout(() => document.getElementById("q")?.focus(), 50); } }
  if (e.key === "Enter" && e.target.id === "pq" && S.pq.trim()) {
    const first = runSearch(ING_INDEX, S.pq).results[0];
    if (first) { const id = first.item.id; S.pantry.has(id) ? S.pantry.delete(id) : S.pantry.add(id); S.pq = ""; save(); render(); document.getElementById("pq")?.focus(); toast(S.pantry.has(id) ? `${ING[id][0]} — есть дома` : `${ING[id][0]} убран`); }
  }
  if (e.key === "Escape" && typing && e.target.dataset?.search) { e.target.value = ""; e.target.dispatchEvent(new Event("input", {bubbles: true})); }
});
document.addEventListener("pointerdown", unlockAudio, {once: true});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
